<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LA Locations Map</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #header {
      background: #1a1a2e;
      color: white;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    #header h1 { font-size: 16px; font-weight: 600; letter-spacing: 0.5px; }

    #map-wrap {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    #map { flex: 1; width: 100%; }

    /* ── Sidebar ── */
    #sidebar {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 268px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 14px rgba(0,0,0,0.22);
      overflow: hidden;
      z-index: 10;
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - 80px);
    }

    #sidebar-header {
      background: #1a1a2e;
      color: white;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
      flex-shrink: 0;
    }

    #location-list { overflow-y: auto; flex: 1; }

    .loc-row {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      border-bottom: 1px solid #f0f0f0;
      gap: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .loc-row:hover { background: #f7f9ff; }

    .loc-num-input {
      width: 36px;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 3px 5px;
      font-size: 12px;
      text-align: center;
      flex-shrink: 0;
    }
    .loc-num-input:focus { outline: none; border-color: #4a90e2; }

    .loc-name { font-size: 12px; color: #333; flex: 1; line-height: 1.3; }

    .loc-go {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
      color: #aaa;
      padding: 2px;
      flex-shrink: 0;
      line-height: 1;
    }
    .loc-go:hover { color: #1a1a2e; }

    /* ── Add-location form ── */
    #add-form {
      border-top: 2px solid #1a1a2e;
      padding: 12px;
      background: #f8f9ff;
      flex-shrink: 0;
    }

    #add-form .form-title {
      font-size: 11px;
      font-weight: 700;
      color: #1a1a2e;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 8px;
    }

    #add-form input {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 5px;
      padding: 6px 9px;
      font-size: 12px;
      margin-bottom: 6px;
      background: white;
    }
    #add-form input:focus { outline: none; border-color: #4a90e2; }
    #add-form input::placeholder { color: #bbb; }

    #add-form .row2 {
      display: flex;
      gap: 6px;
    }
    #add-form .row2 input { margin-bottom: 0; }
    #add-form .row2 #new-num { width: 56px; flex-shrink: 0; text-align: center; }
    #add-form .row2 #new-name { flex: 1; }

    #add-btn {
      width: 100%;
      margin-top: 8px;
      padding: 7px;
      background: #1a1a2e;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    #add-btn:hover { opacity: 0.85; }
    #add-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    #add-status {
      font-size: 11px;
      margin-top: 6px;
      min-height: 14px;
      text-align: center;
    }
    #add-status.err  { color: #c0392b; }
    #add-status.ok   { color: #27ae60; }
    #add-status.info { color: #555; }

    /* ── Splash ── */
    #splash {
      display: flex;
      position: absolute;
      inset: 0;
      background: rgba(240,244,255,0.97);
      align-items: center;
      justify-content: center;
      z-index: 30;
    }
    #splash-box {
      background: white;
      border-radius: 12px;
      padding: 32px 40px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.14);
      text-align: center;
      max-width: 380px;
    }
    #splash-box h2 { margin-bottom: 10px; font-size: 18px; color: #1a1a2e; }
    #splash-box p  { font-size: 13px; color: #555; line-height: 1.6; }
    #splash-box .err { color: #c0392b; font-weight: 600; margin-top: 10px; }
  </style>
</head>
<body>

<div id="header">
  <h1>🗺 LA Locations Map</h1>
</div>

<div id="map-wrap">
  <div id="map"></div>

  <div id="splash">
    <div id="splash-box">
      <h2>Loading Map…</h2>
      <p>Connecting to Google Maps.</p>
      <p id="splash-err" class="err" style="display:none"></p>
    </div>
  </div>

  <div id="sidebar">
    <div id="sidebar-header">Locations — add a # to label</div>
    <div id="location-list"></div>

    <!-- Add new location form -->
    <div id="add-form">
      <div class="form-title">+ Add a location</div>

      <div class="row2">
        <input id="new-num"  type="text" placeholder="#"    maxlength="6" />
        <input id="new-name" type="text" placeholder="Name (e.g. Grand Central Market)" />
      </div>

      <input id="new-addr" type="text"
             placeholder="Address (e.g. 317 S Broadway, Los Angeles)"
             style="margin-top:6px" />

      <button id="add-btn" onclick="addLocation()">Add to Map</button>
      <div id="add-status"></div>
    </div>
  </div>
</div>

<script>
  const LOCATIONS = [
    { name: "Aquarela",             lat: 34.05140, lng: -118.25590 },
    { name: "Bradbury Building",    lat: 34.05050, lng: -118.24870 },
    { name: "Proper",               lat: 34.04360, lng: -118.25790 },
    { name: "LA Public Library",    lat: 34.04960, lng: -118.25610 },
    { name: "Stile (Formerly ACE)", lat: 34.04500, lng: -118.25650 },
    { name: "Arts District",        lat: 34.04030, lng: -118.23270 },
    { name: "Little Tokyo",         lat: 34.05060, lng: -118.23950 },
    { name: "2nd Street Tunnel",    lat: 34.05260, lng: -118.25360 },
    { name: "LA Music Center",      lat: 34.05580, lng: -118.24970 },
  ];

  const numbers = {};
  const markers = {};
  let   map     = null;
  let   geocoder = null;

  // ── SVG icon: bubble + stem + dot ──
  function makeIcon(name, num) {
    const label  = (num ? num + "  " : "") + name;
    const charW  = 7.2, padX = 14;
    const bw     = Math.ceil(label.length * charW) + padX * 2;
    const bh     = 26, stemH = 8, dotR = 6;
    const totalH = bh + stemH + dotR * 2 + 2;
    const cx     = bw / 2;
    const safe   = label.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    const svg = [
      `<svg xmlns="http://www.w3.org/2000/svg" width="${bw}" height="${totalH}">`,
        `<rect x="1" y="1" width="${bw-2}" height="${bh}" rx="5" ry="5" fill="white" stroke="#1a1a2e" stroke-width="1.8"/>`,
        `<text x="${cx}" y="${bh/2+4.5}" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#1a1a2e">${safe}</text>`,
        `<polygon points="${cx-5},${bh} ${cx+5},${bh} ${cx},${bh+stemH}" fill="#1a1a2e"/>`,
        `<circle cx="${cx}" cy="${bh+stemH+dotR+1}" r="${dotR}" fill="#1a1a2e" stroke="white" stroke-width="2"/>`,
      `</svg>`
    ].join("");
    return {
      url:    "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg),
      anchor: new google.maps.Point(cx, bh + stemH + dotR + 1),
    };
  }

  // ── Append one row to the sidebar list ──
  function appendRow(i) {
    const loc  = LOCATIONS[i];
    const list = document.getElementById("location-list");

    const row = document.createElement("div");
    row.className = "loc-row";
    row.dataset.index = i;

    const numInput = document.createElement("input");
    numInput.className   = "loc-num-input";
    numInput.type        = "text";
    numInput.value       = numbers[i] || "";
    numInput.placeholder = "#";
    numInput.title       = "Number label for " + loc.name;
    numInput.addEventListener("input", () => {
      numbers[i] = numInput.value.trim();
      if (markers[i]) markers[i].setIcon(makeIcon(loc.name, numbers[i]));
    });
    numInput.addEventListener("click", e => e.stopPropagation());

    const nameSpan = document.createElement("span");
    nameSpan.className   = "loc-name";
    nameSpan.textContent = loc.name;

    const goBtn = document.createElement("button");
    goBtn.className   = "loc-go";
    goBtn.title       = "Fly to location";
    goBtn.textContent = "📍";
    goBtn.addEventListener("click", e => { e.stopPropagation(); flyTo(i); });

    row.appendChild(numInput);
    row.appendChild(nameSpan);
    row.appendChild(goBtn);
    row.addEventListener("click", () => flyTo(i));
    list.appendChild(row);
  }

  function buildSidebar() {
    document.getElementById("location-list").innerHTML = "";
    LOCATIONS.forEach((_, i) => appendRow(i));
  }

  function flyTo(i) {
    if (!map) return;
    map.panTo({ lat: LOCATIONS[i].lat, lng: LOCATIONS[i].lng });
    map.setZoom(17);
  }

  // ── Add location via geocoding ──
  function addLocation() {
    const name = document.getElementById("new-name").value.trim();
    const addr = document.getElementById("new-addr").value.trim();
    const num  = document.getElementById("new-num").value.trim();

    const status = document.getElementById("add-status");
    const btn    = document.getElementById("add-btn");

    if (!name) { setStatus("err", "Please enter a location name."); return; }
    if (!addr) { setStatus("err", "Please enter an address to search."); return; }

    btn.disabled = true;
    setStatus("info", "Searching address…");

    geocoder.geocode({ address: addr }, (results, gStatus) => {
      btn.disabled = false;

      if (gStatus !== "OK" || !results || !results.length) {
        setStatus("err", "Address not found. Try a more specific address.");
        return;
      }

      const pos = results[0].geometry.location;
      const i   = LOCATIONS.length;

      LOCATIONS.push({ name, lat: pos.lat(), lng: pos.lng() });
      numbers[i] = num;

      const marker = new google.maps.Marker({
        position:  pos,
        map,
        title:     name,
        icon:      makeIcon(name, num),
        optimized: false,
        animation: google.maps.Animation.DROP,
      });
      marker.addListener("click", () => flyTo(i));
      markers[i] = marker;

      appendRow(i);

      // Clear form
      document.getElementById("new-name").value = "";
      document.getElementById("new-addr").value = "";
      document.getElementById("new-num").value  = "";

      setStatus("ok", `"${name}" added!`);
      setTimeout(() => setStatus("", ""), 3000);

      // Fly to new pin
      map.panTo(pos);
      map.setZoom(16);
    });
  }

  function setStatus(cls, msg) {
    const el = document.getElementById("add-status");
    el.className = cls;
    el.textContent = msg;
  }

  // Allow Enter key in address field to trigger add
  document.getElementById("new-addr").addEventListener("keydown", e => {
    if (e.key === "Enter") addLocation();
  });

  // ── Map init callback ──
  window.initMap = function() {
    map      = new google.maps.Map(document.getElementById("map"), {
      center:            { lat: 34.0480, lng: -118.2500 },
      zoom:              14,
      mapTypeControl:    false,
      streetViewControl: false,
      fullscreenControl: true,
    });
    geocoder = new google.maps.Geocoder();

    LOCATIONS.forEach((loc, i) => {
      const marker = new google.maps.Marker({
        position:  { lat: loc.lat, lng: loc.lng },
        map,
        title:     loc.name,
        icon:      makeIcon(loc.name, numbers[i] || ""),
        optimized: false,
      });
      marker.addListener("click", () => flyTo(i));
      markers[i] = marker;
    });

    buildSidebar();
    document.getElementById("splash").style.display = "none";
  };

  window.gm_authFailure = function() {
    const err = document.getElementById("splash-err");
    err.textContent = "API key error. Make sure the Maps JavaScript API is enabled in Google Cloud Console.";
    err.style.display = "block";
    document.getElementById("splash").querySelector("h2").textContent = "Map Error";
    document.getElementById("splash").querySelector("p").textContent  = "";
    document.getElementById("splash").style.display = "flex";
  };

  // ── Auto-load ──
  (function() {
    const API_KEY = "AIzaSyBDQzSNdjX8ioOYFCa_jMAcA2ofnKmgdzA";
    const script   = document.createElement("script");
    script.id      = "gmap-script";
    script.src     = `https://maps.googleapis.com/maps/api/js?key=${API_KEY}&callback=initMap`;
    script.async   = true;
    script.onerror = () => {
      document.getElementById("splash-err").textContent = "Failed to load Google Maps. Check your network connection.";
      document.getElementById("splash-err").style.display = "block";
      document.getElementById("splash").querySelector("h2").textContent = "Map Error";
      document.getElementById("splash").style.display    = "flex";
    };
    document.head.appendChild(script);
  })();
</script>

</body>
</html>
